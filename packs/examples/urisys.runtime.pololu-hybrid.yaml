# Example: urisys resolver — Pololu Tic T249 on PC + ESP32 (hybrid lab)
#
# Use with markpact-pololu flows (tic-t249-hybrid-pc-esp32) or single-authority flows.
# Source repo: https://github.com/tellmesh/markpact-pololu
#
#   export URISYS_RESOLVER_CONFIG=markpact-contracts/packs/examples/urisys.runtime.pololu-hybrid.yaml
#   urisys markpact run markpact-pololu/markpacts/pololu-tic-t249.stepper.markpact.md#tic-t249-hybrid-pc-esp32 \
#     --approve --dry-run --force
#
# Requires running edge runtimes:
#   PC:    http://127.0.0.1:8791/uri/call  (uritic-host or docker-compose)
#   ESP32: http://esp32-tic.local:8791/uri/call

environment: hybrid-lab

targets:
  tic-t249:
    platform: pc-linux
    transport: http
    endpoint: http://127.0.0.1:8791/uri/call
    adapter: external
    options:
      timeout_ms: 10000

  tic-t249-pc:
    platform: pc-linux
    transport: http
    endpoint: http://127.0.0.1:8791/uri/call
    adapter: external
    options:
      timeout_ms: 10000

  tic-t249-esp32:
    platform: esp32
    transport: http
    endpoint: http://esp32-tic.local:8791/uri/call
    adapter: external
    options:
      timeout_ms: 15000

runtime:
  default_environment: mock
  dry_run: true
  device_profile:
    axes:
      x:
        driver: pololu-tic-t249
    safety:
      x:
        max_single_move_steps: 100000
        max_speed_sps: 1200
